name: Check test vectors
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check-test-vectors:
    name: Ensure test vectors are up to date
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Check if test vectors are up to date
        run: |
          pip install poetry
          cd test-vectors
          ./inject-generated-content.sh --check
